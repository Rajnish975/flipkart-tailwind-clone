<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/src/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Login</title>
</head>

<body>
    <section class="min-h-screen flex items-center justify-center">

        <div class="container w-[400px] bg-gray-200 p-6 rounded-lg">

            <h1 class="text-2xl font-bold text-center mb-5">Login</h1>

            <div class="mb-3">
                <label for="number" class="text-sm">Number</label>
                <input type="text" name="number" class="w-full border-2 border-gray-400 rounded px-2.5 py-1.5"
                    placeholder="Number">
            </div>

            <div class="mb-3">
                <label for="password" class="text-sm">Password</label>
                <input type="password" name="password" class="w-full border-2 border-gray-400 rounded px-2.5 py-1.5"
                    placeholder="*******">
            </div>

            <button class="bg-blue-400 px-1.5 py-2 w-full rounded text-white hover:bg-blue-500 mb-3">
                Login
            </button>

            <div class="flex justify-end">
                <a href="register.html" class="text-blue-500 hover:text-blue-700">
                    Register New User
                </a>
            </div>

        </div>

    </section>
</body>

</html>
